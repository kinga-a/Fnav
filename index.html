<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="F-Nav - 一个现代化的云端导航页面，帮助您管理和快速访问常用网站链接" />
    <meta name="keywords" content="导航,书签,云导航,网站导航,书签管理,CloudNav" />
    <meta name="author" content="F-nav" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:title" content="导航" />
    <meta property="og:description" content="一个现代化的云端导航页面，帮助您管理和快速访问常用网站链接" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://sq.y11.fun" />
    <meta property="og:site_name" content="导航" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="F-Nav" />
    <meta name="twitter:description" content="一个现代化的云端导航页面，帮助您管理和快速访问常用网站链接" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sq.y11.fun" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//api.xinac.net" />
    <link rel="dns-prefetch" href="//v1.hitokoto.cn" />
    <link rel="dns-prefetch" href="//v1.jinrishici.com" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://api.xinac.net" crossorigin />

    <!-- Security Headers -->
    <!-- 注：Content-Security-Policy 无法通过 <meta http-equiv> 生效（VULN-14），已移至部署级 _headers 文件 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <title>F-Nav</title>
    <link rel="stylesheet" href="/src/index.css">
    <script>
      // 确保页面加载时使用正确的主题
      (function() {
        const theme = localStorage.getItem('cloudnav_theme_preference');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#1c2128');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
</head>
  <body class="bg-gray-50 text-slate-900 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
